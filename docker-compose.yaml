services:
  web:
    image: nginx:alpine
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: ${DOMAIN:?Set DOMAIN in .env}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${DOMAIN:?Set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - net-proxy

networks:
  net-proxy:
    external: true
